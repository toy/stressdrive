name: test
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: create ram disk
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          # xargs to trim whitespace
          ram_disk=$(hdiutil attach -nomount ram://$(( 4 * 1024 * 1024 * 1024 / 512 )) | xargs)
          ln -s "${ram_disk/disk/rdisk}" ram_disk
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          mkdir tmpfs
          sudo mount -t tmpfs -o noswap,size=4g tmpfs tmpfs
          dd if=/dev/zero of=tmpfs/data bs=1G count=4
          ram_disk=$(sudo losetup --find --show tmpfs/data)
          sudo chmod 777 "$ram_disk"
          ln -s "$ram_disk" ram_disk
        fi
    - name: benchmark
      shell: bash -eo pipefail {0}
      run: |
        git config user.email "not@important.com"
        git config user.name "Not Important"

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          export OPENSSL_DIR=$(brew --prefix openssl@3)
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get install libssl-dev
        fi

        for branch in develop aes-ctr faster faster-simpler-but-more-buffers; do
          echo "# $branch ################"
          git checkout --quiet "$branch"
          git rebase --quiet benchmark
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            gcc stressdrive.c -o stressdrive -lcrypto -framework IOKit -framework CoreServices -I"$OPENSSL_DIR/include" -L"$OPENSSL_DIR/lib"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            gcc stressdrive.c -o stressdrive -lcrypto
          fi
          for i in 1 2 3; do
            echo "## try $i"
            ./stressdrive ram_disk | tr '\r' '\n' | grep '100.0%'
          done
        done
